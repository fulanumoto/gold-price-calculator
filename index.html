<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة سعر الذهب</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="حاسبة الذهب">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        let deferredPrompt;
        let installButton;

        window.addEventListener('load', () => {
            installButton = document.createElement('button');
            installButton.className = 'fixed bottom-4 right-4 bg-purple-500 text-white p-3 rounded-full shadow-lg hover:bg-purple-600 transition-colors z-50 hidden';
            installButton.id = 'installButton';
            installButton.innerHTML = 'ثبّت التطبيق';
            document.body.appendChild(installButton);

            // Add click handler immediately after creating the button
            installButton.addEventListener('click', async () => {
                console.log('Install button clicked');
                if (!deferredPrompt) {
                    console.log('No deferred prompt available');
                    return;
                }
                try {
                    console.log('Showing install prompt');
                    await deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log('Installation outcome:', outcome);
                    if (outcome === 'accepted') {
                        installButton.classList.add('hidden');
                    }
                } catch (error) {
                    console.error('Error installing PWA:', error);
                }
            });
        });

        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('beforeinstallprompt event fired');
            e.preventDefault();
            deferredPrompt = e;
            if (installButton) {
                console.log('Showing install button');
                installButton.classList.remove('hidden');
            }
        });

        window.addEventListener('appinstalled', () => {
            console.log('App installed successfully');
            if (installButton) {
                installButton.classList.add('hidden');
            }
        });

        function toggleActive(button) {
            document.querySelectorAll(".toggle-button").forEach(btn => {
                btn.classList.remove("bg-blue-500", "bg-green-500", "text-white");
                btn.classList.add("bg-gray-200", "text-gray-800");
            });
            button.classList.remove("bg-gray-200", "text-gray-800");
            button.classList.add(button.dataset.activeColor, "text-white");
        }
        
        function calculateSellingPrice() {
            let dailyPrice = parseFloat(document.getElementById("dailyPrice").value) || 0;
            let additional = parseFloat(document.getElementById("additional").value) || 0;
            let selectedFormula = document.querySelector('input[name="formulaType"]:checked').value;
            let result = 0;
            
            if (selectedFormula === "ounces") {
                document.getElementById("ouncesFields").classList.remove("hidden");
                document.getElementById("sahrawiFields").classList.add("hidden");
                let weight = parseFloat(document.getElementById("goldWeight").value) || 0;
                const goldPurity = 999.9;
                const basePurity = 750;
                result = weight * (goldPurity / basePurity) * (dailyPrice + additional);
            } else {
                document.getElementById("sahrawiFields").classList.remove("hidden");
                document.getElementById("ouncesFields").classList.add("hidden");
                let weight = parseFloat(document.getElementById("sahrawiWeight").value) || 0;
                let goldPurity = parseFloat(document.getElementById("sahrawiPurity").value) || 0;
                const basePurity = 750;
                result = weight * (goldPurity / basePurity) * (dailyPrice + additional);
            }
            document.getElementById("result").innerText = "السعر: " + result.toFixed(2) + " دينار";
        }
        
        function calculateBuyingPrice() {
            let goldPriceUSD = parseFloat(document.getElementById("goldPriceUSD").value) || 0;
            let bankDeduction = parseFloat(document.getElementById("bankDeduction").value) || 0;
            let cashPrice = parseFloat(document.getElementById("cashPrice").value) || 0;
            let shippingCost = parseFloat(document.getElementById("shippingCost").value) || 0;
            
            const conversionRate = 41.47;
            let result = ((goldPriceUSD - bankDeduction) / conversionRate) * cashPrice - shippingCost;
            
            document.getElementById("buyingResult").innerText = "سعر الشراء: " + result.toFixed(2) + " دينار";
        }

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js")
                .then(() => console.log("Service Worker Registered"))
                .catch(error => console.log("Service Worker Registration Failed:", error));
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }
    </style>
</head>
<body class="p-6 bg-gray-100 text-gray-900">
    <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md">
        <img src="logo.png" alt="شعار" class="mx-auto mb-4 w-50 h-50">
        <h2 class="text-xl font-bold mb-4 text-center">حاسبة سعر الذهب</h2>
        
        <div class="mb-4 flex justify-center space-x-4">
            <button onclick="document.getElementById('sellingSection').classList.remove('hidden'); document.getElementById('buyingSection').classList.add('hidden'); toggleActive(this);" class="toggle-button px-4 py-2 bg-blue-500 text-white rounded-full" data-active-color="bg-blue-500">حساب سعر البيع</button>
            <button onclick="document.getElementById('buyingSection').classList.remove('hidden'); document.getElementById('sellingSection').classList.add('hidden'); toggleActive(this);" class="toggle-button px-4 py-2 bg-gray-200 text-gray-800 rounded-full" data-active-color="bg-green-500">حساب سعر الشراء</button>
        </div>
        
        <div id="sellingSection">
            <div class="mb-4 flex justify-center space-x-4">
                <label class="inline-flex items-center">
                    <input type="radio" name="formulaType" value="ounces" checked class="form-radio text-blue-500" onclick="calculateSellingPrice()">
                    <span class="ml-2">أونصات</span>
                </label>
                <label class="inline-flex items-center">
                    <input type="radio" name="formulaType" value="sahrawi" class="form-radio text-blue-500" onclick="calculateSellingPrice()">
                    <span class="ml-2">صحراوي</span>
                </label>
            </div>
            <div id="ouncesFields">
                <label class="block text-right">:وزن الذهب بالقرام</label>
                <input type="number" id="goldWeight" placeholder="أدخل وزن الذهب" step="0.01" class="w-full p-2 border rounded mb-2">
            </div>
            <div id="sahrawiFields" class="hidden">
                <label class="block text-right">:وزن الذهب بالقرام</label>
                <input type="number" id="sahrawiWeight" placeholder="أدخل وزن الذهب" step="0.01" class="w-full p-2 border rounded mb-2">
                <label class="block text-right">:عيار السبيكة</label>
                <input type="number" id="sahrawiPurity" placeholder="أدخل عيار سبيكة الذهب" step="0.01" class="w-full p-2 border rounded mb-2">
            </div>
            <label class="block text-right">:سعر الذهب اليوم</label>
            <input type="number" id="dailyPrice" placeholder="أدخل القيمة بالدينار الليبي" step="0.01" class="w-full p-2 border rounded mb-2">
            <label class="block text-right">:الفرق</label>
            <input type="number" id="additional" placeholder="أدخل قيمة الفرق على المسبوك" step="0.01" class="w-full p-2 border rounded mb-4">
            <button onclick="calculateSellingPrice()" class="w-full bg-blue-500 text-white p-2 rounded">احسب السعر</button>
            <h3 id="result" class="text-lg font-bold mt-4 text-center">السعر: 0.00 دينار</h3>
        </div>
        
        <div id="buyingSection" class="hidden">
            <label class="block text-right">:سعر الشاشة</label>
            <input type="number" id="goldPriceUSD"placeholder="أدخل قيمة الذهب بالدولار الأمريكي" step="0.01" class="w-full p-2 border rounded mb-2">
            <label class="block text-right">:خصم المصرف</label>
            <input type="number" id="bankDeduction" placeholder="أدخل قيمة الخصم من المصرف" step="0.01" class="w-full p-2 border rounded mb-2">
            <label class="block text-right">:السعر النقدي (الكاش)</label>
            <input type="number" id="cashPrice" placeholder="أدخل قيمة نقد دبي أو تركيا" step="0.01" class="w-full p-2 border rounded mb-2">
            <label class="block text-right">:خصم الشحن</label>
            <input type="number" id="shippingCost" placeholder="أدخل قيمة ضريبة الشحن" step="0.01" class="w-full p-2 border rounded mb-4">
            <button onclick="calculateBuyingPrice()" class="w-full bg-green-500 text-white p-2 rounded">احسب السعر</button>
            <h3 id="buyingResult" class="text-lg font-bold mt-4 text-center">سعر الشراء: 0.00 دينار</h3>
        </div>
    </div>
</body>
</html>
