<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة سعر الذهب</title>
  <!-- رابط إلى Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- رابط إلى ملف الـ Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="حاسبة سعر الذهب">
</head>
<body class="bg-gray-100 font-sans">
  <div class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
      <!-- Logo -->
      <div class="text-center mb-6">
        <img src="logo.png" alt="Gold Price Calculator Logo" class="mx-auto w-50 h-50">
      </div>
      <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">حاسبة سعر الذهب</h2>
      <form id="goldForm">
        <div class="mb-4">
          <label for="gramsOfGold" class="block text-gray-700 font-medium">وزن غرام الذهب</label>
          <input type="number" id="gramsOfGold" class="mt-1 p-2 w-full border rounded-md" placeholder="أدخل وزن الذهب" required step="0.01">
        </div>
        <div class="mb-4">
          <label for="priceOfGold" class="block text-gray-700 font-medium">سعر غرام الذهب</label>
          <input type="number" id="priceOfGold" class="mt-1 p-2 w-full border rounded-md" placeholder="أدخل سعر الذهب اليوم" required step="0.01">
        </div>
        <div class="mb-4">
          <label for="additionalPrice" class="block text-gray-700 font-medium">السعر المُضاف</label>
          <input type="number" id="additionalPrice" class="mt-1 p-2 w-full border rounded-md" placeholder="أدخل السعر الإضافي" required step="0.01">
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600">احسب السعر</button>
      </form>
      <div id="result" class="mt-6 text-center text-xl text-gray-800 font-semibold hidden">
        <p>سعر بيع <span id="resultGoldAmount"></span> جرام من الذهب هو: <span id="resultPrice"></span> دينار ليبي.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
